services:
  postgres:
    image: postgres:16-alpine
    container_name: maremereso-postgres
    environment:
      POSTGRES_DB: maremereso_olga
      POSTGRES_USER: maremereso
      POSTGRES_PASSWORD: maremereso_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maremereso -d maremereso_olga"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
